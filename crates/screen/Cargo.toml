[package]
name = "p2pcli-screen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "远程画面的平台实现：抓屏、硬件编码、注入键鼠"

[dependencies]
p2pcli-core.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio = { workspace = true }
# 指针图案用 base64 装进 JSON
base64 = "0.22"

# macOS：ScreenCaptureKit 抓屏（画面留在 GPU 的 IOSurface 里）→ VideoToolbox 硬件 H.264 编码；CGEvent 注入键鼠
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-video-toolbox = "0.3"
objc2-screen-capture-kit = "0.3"
# 读整个系统当前的鼠标指针样子
# 剪贴板互通：NSPasteboard、粘贴时才传的数据提供者，TIFF 换 PNG
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSCursor", "NSImage", "NSImageRep", "NSGraphicsContext", "NSPasteboard", "NSPasteboardItem", "NSBitmapImageRep", "objc2-core-graphics", "objc2-core-foundation"] }
block2 = "0.6"
dispatch2 = "0.3"
# 4:4:4：在 GPU 上把 BGRA 画面排成三倍高的灰度图
objc2-metal = { version = "0.3", default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLLibrary",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
] }

# Windows：Windows.Graphics.Capture 抓屏 → D3D11 视频处理器在 GPU 上转 NV12 → Media Foundation 硬件 H.264 编码；SendInput 注入键鼠
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # 剪贴板互通：读剪贴板、OLE 剪贴板（粘贴时才传）、虚拟文件
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
# 剪贴板里的位图（DIB）和 PNG 互换
png = "0.18"
# 实现 COM 接口（剪贴板的 IDataObject、文件流 IStream）的宏要直接引它
windows-core = "0.62"

[dev-dependencies]
tracing-subscriber.workspace = true

# 真的系统剪贴板的测试：macOS 的数据提供者在主线程上被调，自己写 main 跑 run loop
[[test]]
name = "clip_mac"
harness = false
