[package]
name = "p2pcli-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iroh.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
rand.workspace = true
bytes.workspace = true
portable-pty = "0.9"
whoami = "2"
netdev = "0.45.1"
# WebSocket 牵线（可部署到 Cloudflare）；TLS 用 iroh 已经在用的 ring，不另引加密库
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2"
# 局域网发现（mDNS），iroh 官方维护
iroh-mdns-address-lookup = "0.6.1"
n0-future = "0.3"
# 传文件时核对每个文件；iroh 自己也在用
blake3 = "1"
