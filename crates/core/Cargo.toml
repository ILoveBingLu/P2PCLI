[package]
name = "p2pcli-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["host"]
# 被连的一方：开终端、跑命令、tmux 会话、语言服务、改远程文件、端口列表、移到回收站。
# 手机端只当连接的一方，关掉它（--no-default-features）就不编这些，也不带它们的依赖
host = ["dep:portable-pty", "dep:ignore", "dep:regex", "dep:trash", "dep:libc"]

[dependencies]
iroh.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
rand.workspace = true
bytes.workspace = true
portable-pty = { version = "0.9", optional = true }
whoami = "2"
# 和 iroh 的 netwatch 用同一版（打了 iOS 补丁，见 vendor/netdev/PATCHES.md）
netdev = "0.46"
# WebSocket 牵线（可部署到 Cloudflare）；TLS 用 iroh 已经在用的 ring，不另引加密库
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2"
# 局域网发现（mDNS），iroh 官方维护
iroh-mdns-address-lookup = "0.6.1"
n0-future = "0.3"
# 传文件时核对每个文件；iroh 自己也在用
blake3 = "1"
# 认会话里跑的命令行 AI：读进程的完整命令行，Mac 和 Windows 通用
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
# QUIC 的拥塞控制算法（BBR3、Cubic）：iroh 没有重新导出，选算法要直接用它；版本要和 iroh 用的一致
noq-proto = "=1.4.0"
# 控制口里命令输出的原始字节用 base64 装进 JSON
base64 = "0.22"
rusqlite = { version = "0.41", features = ["bundled"] }
# 远程编辑的全项目搜索：ripgrep 用的目录遍历，认 .gitignore；匹配用 regex
ignore = { version = "0.4", optional = true }
regex = { version = "1", optional = true }
# 远程编辑删除文件时移到废纸篓/回收站，不直接删掉
trash = { version = "5", optional = true }

[target.'cfg(unix)'.dependencies]
# 远程执行的命令超时或被取消时，按进程组结束它和它的子进程
libc = { version = "0.2", optional = true }

[dev-dependencies]
# 链路模拟实验（tests/lossy_link.rs）用：自己写一个内存里的传输，带延迟、丢包、带宽上限；版本和 iroh 用的一致
iroh-base = "=1.4.1"
n0-watcher = "1"
noq-udp = "=1.4.0"
