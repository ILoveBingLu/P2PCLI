<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440">
  <!-- dmg 窗口背景。Finder 把图标中心放在 (180,196) 和 (480,196)，文件名在图标下面；
       窗口高 466，标题栏占掉 28 到 32，底部会被裁掉一点，所以要紧的内容都在 400 以内。 -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#edf1f7"/>
    </linearGradient>
    <radialGradient id="blue">
      <stop stop-color="#60a5fa" stop-opacity=".22"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="green">
      <stop stop-color="#34d399" stop-opacity=".16"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="296" y1="0" x2="364" y2="0">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0f172a" flood-opacity=".07"/>
    </filter>
  </defs>
  <rect width="660" height="440" fill="url(#page)"/>
  <ellipse cx="610" cy="10" rx="300" ry="220" fill="url(#blue)"/>
  <ellipse cx="30" cy="430" rx="300" ry="210" fill="url(#green)"/>

  <g font-family="-apple-system, 'SF Pro Display', 'PingFang SC', sans-serif" text-anchor="middle">
    <text x="330" y="58" font-size="26" font-weight="700" letter-spacing=".5" fill="#0f172a">P2PCLI</text>
    <text x="330" y="82" font-size="13" letter-spacing="1.5" fill="#64748b">点对点远程终端</text>
  </g>

  <g fill="url(#card)" stroke="#fff" stroke-width="1.2" filter="url(#lift)">
    <rect x="92" y="112" width="176" height="190" rx="30"/>
    <rect x="392" y="112" width="176" height="190" rx="30"/>
  </g>

  <g fill="none" stroke="url(#arrow)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M296 196h66"/>
    <path d="M352 186l11 10-11 10"/>
  </g>

  <g font-family="-apple-system, 'SF Pro Text', 'PingFang SC', sans-serif" text-anchor="middle">
    <text x="330" y="342" font-size="14" fill="#334155">把 P2PCLI 拖到 Applications，就装好了</text>
    <text x="330" y="388" font-size="11.5" fill="#94a3b8">第一次打开被拦下时：系统设置 → 隐私与安全性 → 仍要打开</text>
  </g>
</svg>
