<svg xmlns="http://www.w3.org/2000/svg" width="48" height="36" viewBox="94.5 163 853 640">
  <!-- Mac 菜单栏图标：只要 logo 的图形，单色，系统按菜单栏深浅自动染色（模板图）。
       图形取自 AppIcon.icon 的各图层，坐标沿用它的 1024 画布；出图 48x36，即 2 倍屏的 24x18 点。
       单色时指针会和下划线粘在一起，所以在指针周围把下划线挖掉一圈。 -->
  <defs>
    <path id="pointer" d="M 578.89 424.56 A 11.95 11.95 0 0 1 594.56 408.89 L 858.56 516.89 A 12.00 12.00 0 0 1 856.78 539.66 L 752.41 564.65 A 24.00 24.00 0 0 0 734.65 582.38 L 709.69 686.78 A 12.00 12.00 0 0 1 686.89 688.56 Z"/>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <use href="#pointer" fill="#000" stroke="#000" stroke-width="132" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g fill="#000" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
    <line x1="196" y1="420" x2="356" y2="565" stroke-width="84"/>
    <line x1="356" y1="565" x2="196" y2="710" stroke-width="84"/>
    <rect x="424" y="668" width="316" height="84" rx="42" stroke="none" mask="url(#gap)"/>
    <use href="#pointer" stroke-width="60"/>
    <g fill="none" stroke-width="60">
      <path d="M 698.00 290.40 L 650.00 336.00"/>
      <path d="M 484.40 384.00 L 414.80 364.80"/>
      <path d="M 506.00 480.00 L 460.40 528.00"/>
      <path d="M 534.80 244.80 L 554.00 314.40"/>
    </g>
  </g>
</svg>
