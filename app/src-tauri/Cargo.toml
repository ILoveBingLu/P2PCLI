[package]
name = "p2pcli-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "p2pcli_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
p2pcli-core.workspace = true
iroh.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-notification = "2.7.0"
tauri-plugin-updater = "2.14.0"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
tauri-plugin-window-controls = "=0.2.1"
