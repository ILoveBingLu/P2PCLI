<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="141 103 760 760">
  <!-- 软件界面里用的 logo：只要图形，不要 app 图标的深色底。软件只有深色主题，颜色照搬图标。
       图形取自 src-tauri/icons/AppIcon.icon 的各图层，坐标沿用它的 1024 画布，裁成图形居中的正方形。
       没有图标里的玻璃和阴影，指针会和下划线贴在一起，所以在指针周围把下划线挖掉一圈。 -->
  <defs>
    <path id="pointer" d="M 578.89 424.56 A 11.95 11.95 0 0 1 594.56 408.89 L 858.56 516.89 A 12.00 12.00 0 0 1 856.78 539.66 L 752.41 564.65 A 24.00 24.00 0 0 0 734.65 582.38 L 709.69 686.78 A 12.00 12.00 0 0 1 686.89 688.56 Z"/>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <use href="#pointer" fill="#000" stroke="#000" stroke-width="132" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g stroke="#34d399" stroke-width="84" stroke-linecap="round">
    <line x1="196" y1="420" x2="356" y2="565"/>
    <line x1="356" y1="565" x2="196" y2="710"/>
  </g>
  <rect x="424" y="668" width="316" height="84" rx="42" fill="#e5e7eb" mask="url(#gap)"/>
  <use href="#pointer" fill="#60a5fa" stroke="#60a5fa" stroke-width="60" stroke-linejoin="round"/>
  <g fill="none" stroke="#60a5fa" stroke-width="60" stroke-linecap="round">
    <path d="M 698.00 290.40 L 650.00 336.00"/>
    <path d="M 484.40 384.00 L 414.80 364.80"/>
    <path d="M 506.00 480.00 L 460.40 528.00"/>
    <path d="M 534.80 244.80 L 554.00 314.40"/>
