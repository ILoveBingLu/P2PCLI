# Xcode 工程由 XcodeGen 按这个文件生成（brew install xcodegen；在本目录跑 xcodegen）。
# 生成的 P2PCLI.xcodeproj 不进仓库，改工程设置改这里。打包前先跑 build-rust.sh 编 Rust 库。
name: P2PCLI
options:
  bundleIdPrefix: io.github.ilovebinglu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  # 中英文：跟随系统时中文环境用中文，其他用英文
  knownRegions: [en, zh-Hans]

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.19.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    # 打包（build-ipa.sh、发布工作流）时换成 app/src-tauri/tauri.conf.json 里的版本号；这里只是 Xcode 里直接编时用的
    MARKETING_VERSION: "0.1.11"
    CURRENT_PROJECT_VERSION: "1"
    # 必须用 Xcode 27.1 以上的 SDK 编：iPhone Duo 上才会铺满屏幕、跟着折叠和开合调整
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  P2PCLI:
    type: application
    platform: iOS
    sources:
      - path: P2PCLI
      - path: build/rust/swift/p2pcli_mobile.swift
        optional: true
      # App 图标：和 Mac 版同一个 Icon Composer 文件（分层的液态玻璃图标），旧系统由 Xcode 自动生成平面版
      - path: ../../app/src-tauri/icons/AppIcon.icon
        type: file
        buildPhase: resources
      # 界面文字和桌面同一份翻译
      - path: ../../app/src/i18n/locales/en.json
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
      - framework: build/rust/P2pcliMobile.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: Network.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ilovebinglu.p2pcli
        PRODUCT_NAME: P2PCLI
        INFOPLIST_FILE: P2PCLI/Info.plist
        # iPhone（含 iPhone Duo）和 iPad
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: ["-lresolv"]
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  P2PCLIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: P2PCLIUITests
    dependencies:
      - target: P2PCLI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ilovebinglu.p2pcli.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  P2PCLI:
    build:
      targets:
        P2PCLI: all
        P2PCLIUITests: [test]
    test:
      targets: [P2PCLIUITests]
