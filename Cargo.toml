[workspace]
resolver = "3"
members = ["crates/core", "crates/dev", "crates/server", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
p2pcli-core = { path = "crates/core" }
# 选路接口标着不稳定，锁死版本，升级时要重看 path.rs
iroh = { version = "=1.4.1", features = ["unstable-custom-transports"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.10"
bytes = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
