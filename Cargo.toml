[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/dev", "crates/server", "crates/mobile-ffi", "app/src-tauri"]
exclude = ["vendor/tauri-plugin-window-controls", "vendor/iroh-mdns-address-lookup", "vendor/netdev"]

[patch.crates-io]
tauri-plugin-window-controls = { path = "vendor/tauri-plugin-window-controls" }
iroh-mdns-address-lookup = { path = "vendor/iroh-mdns-address-lookup" }
# 0.46.3 编不了 iOS（手机原生接口要编），把 0.47.0 的修复搬过来；iroh 的 netwatch 升到 0.47 以后去掉，见 vendor/netdev/PATCHES.md
netdev = { path = "vendor/netdev" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# 默认不开 host（手机端只当连接的一方）；要被连的成员自己写 features = ["host"]
p2pcli-core = { path = "crates/core", default-features = false }
# 选路接口标着不稳定，锁死版本，升级时要重看 path.rs
iroh = { version = "=1.4.1", features = ["unstable-custom-transports", "unstable-net-report"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.10"
bytes = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
