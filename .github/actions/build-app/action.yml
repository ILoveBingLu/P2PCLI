# 编一个平台的安装包和在线更新包，放到 dist/ 上传，给 app-release.yml 里各平台的任务共用。
name: 编安装包
description: 编一个平台的 P2PCLI 安装包和在线更新包

inputs:
  target:
    description: Rust 目标，例如 aarch64-apple-darwin
    required: true
  bundles:
    description: 要打的包，Mac 是 app,dmg，Windows 是 nsis，Linux 是 appimage,deb,rpm
    required: true
  arch:
    description: 文件名里的架构，aarch64 或 x64
    required: true
  signing-key:
    description: 在线更新包的签名私钥
    required: true
  macos-certificate:
    description: Mac 代码签名证书（自签名，p12 转 base64）；不同版本用同一张，系统设置里给的录屏、辅助功能权限更新后才不会失效
    required: false
    default: ""
  macos-certificate-password:
    description: Mac 代码签名证书的密码
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: 标签要和软件版本一致
      if: github.ref_type == 'tag'
      shell: bash
      run: |
        want="v$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
        if [ "$GITHUB_REF_NAME" != "$want" ]; then
          echo "标签是 $GITHUB_REF_NAME，tauri.conf.json 里的版本对应 $want"
          exit 1
        fi

    - uses: pnpm/action-setup@v4
      with:
        version: 12.14.0

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: 装 Linux 桌面和打包依赖
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev \
          libssl-dev libayatana-appindicator3-dev librsvg2-dev \
          libfuse2 patchelf rpm xdg-utils
        # AppImage 必须原生打包，不能把 x64 会话组件带进 ARM 包。
        test "$(rustc --print host-tuple)" = "${{ inputs.target }}"

    - name: 装 Rust 目标
      shell: bash
      run: rustup target add ${{ inputs.target }}

    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.target }}

    - name: 装前端依赖
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: 校验组件与发布映射
      shell: bash
      run: node --test scripts/check-session-tools.test.mjs scripts/check-app-release.test.mjs

    - name: 验证 Linux 会话输入
      if: runner.os == 'Linux'
      shell: bash
      run: node scripts/check-agent-input.mjs

    # 临时签名（ad-hoc）的认人规则是整个程序的指纹，每个版本都不一样，macOS 就当成另一个程序，
    # 用户每次更新都得重新给录屏、辅助功能权限。用同一张证书签，规则是“这张证书签的”，更新后照样认。
    # 证书是自签名的，苹果不认，第一次打开照样要放行；系统提示证书不受信任，codesign 照样能签
    - name: 装 Mac 签名证书
      if: runner.os == 'macOS'
      shell: bash
      env:
        CERTIFICATE: ${{ inputs.macos-certificate }}
        CERTIFICATE_PASSWORD: ${{ inputs.macos-certificate-password }}
      run: |
        if [ -z "$CERTIFICATE" ] || [ -z "$CERTIFICATE_PASSWORD" ]; then
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::仓库 Secrets 里缺 Mac 签名证书（MACOS_CERTIFICATE、MACOS_CERTIFICATE_PASSWORD），这次不发布：临时签名的版本装上后用户又得重新授权"
            exit 1
          fi
          echo "::warning::没有 Mac 签名证书，这次用临时签名，只能自己试用"
          exit 0
        fi
        kc="$RUNNER_TEMP/p2pcli-signing.keychain-db"
        kc_pw="$(openssl rand -hex 16)"
        echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
        security create-keychain -p "$kc_pw" "$kc"
        security set-keychain-settings -lut 21600 "$kc"
        security unlock-keychain -p "$kc_pw" "$kc"
        security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" > /dev/null
        security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
        rm -f "$RUNNER_TEMP/signing.p12"
        security find-identity -p codesigning "$kc"
        # Tauri 按这个名字找证书签名，盖过 tauri.macos.conf.json 里的 "-"（本机打包照旧临时签名）
        echo "APPLE_SIGNING_IDENTITY=P2PCLI Self-Signed Code Signing" >> "$GITHUB_ENV"

    - name: 打包
      shell: bash
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.signing-key }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        # Tauri 发现在 CI 里就跳过 dmg 窗口的排版（背景图、图标位置），GitHub 的 Mac 机器能排，让它照常排
        TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        APPIMAGE_EXTRACT_AND_RUN: "1"
      run: |
        if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
          echo "仓库 Secrets 里没有 TAURI_SIGNING_PRIVATE_KEY，在线更新包签不了名"
          exit 1
        fi
        pnpm tauri build --target ${{ inputs.target }} --bundles ${{ inputs.bundles }} \
          --config '{"bundle":{"createUpdaterArtifacts":true}}'

    - name: 验证 Linux CLI 安装
      if: runner.os == 'Linux'
      shell: bash
      run: cargo test --locked --release -p p2pcli-app --lib cli::tests --target ${{ inputs.target }}

    - name: 收集安装包
      shell: bash
      run: |
        # 推 ci/ 分支试编时没有标签，版本号从配置里读
        ver="$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
        b="target/${{ inputs.target }}/release/bundle"
        mkdir -p dist
        if [ -d "$b/macos" ]; then
          # 整个 app 要有完整的签名，只有编译器自带的签名时，下载后会提示“已损坏，无法打开”
          codesign --verify --deep --strict --verbose=2 "$b/macos/P2PCLI.app"
          # 用了证书就要真的签上：认人规则是证书，不是程序指纹
          req="$(codesign -dr - "$b/macos/P2PCLI.app" 2>&1)"
          echo "$req"
          if [ -n "$APPLE_SIGNING_IDENTITY" ] && ! echo "$req" | grep -q "certificate root"; then
            echo "::error::Mac 安装包没有用签名证书签上"
            exit 1
          fi
          cp "$b/dmg/P2PCLI_${ver}_${{ inputs.arch }}.dmg" dist/
          cp "$b/macos/P2PCLI.app.tar.gz" "dist/P2PCLI_${ver}_${{ inputs.arch }}.app.tar.gz"
          cp "$b/macos/P2PCLI.app.tar.gz.sig" "dist/P2PCLI_${ver}_${{ inputs.arch }}.app.tar.gz.sig"
        elif [ "$RUNNER_OS" = "Linux" ]; then
          shopt -s nullglob
          for kind in appimage deb rpm; do
            ext="$kind"
            [ "$kind" != "appimage" ] || ext="AppImage"
            files=("$b/$kind/"*."$ext")
            if [ "${#files[@]}" -ne 1 ]; then
              echo "期望一个 $kind 安装包，实际找到 ${#files[@]} 个"
              exit 1
            fi
            out="dist/P2PCLI_${ver}_${{ inputs.arch }}.$ext"
            cp "${files[0]}" "$out"
            cp "${files[0]}.sig" "$out.sig"
          done
        else
          cp "$b/nsis/P2PCLI_${ver}_${{ inputs.arch }}-setup.exe" dist/
          cp "$b/nsis/P2PCLI_${ver}_${{ inputs.arch }}-setup.exe.sig" dist/
        fi
        ls -la dist

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.target }}
        path: dist/*
        if-no-files-found: error
