# 推 vX.Y.Z 标签时，Mac 两种芯片、Windows 三种架构、Linux 两种架构的安装包同时开编，
# 编完由“发布”汇总，连同在线更新用的 latest.json 一起发到发布页，并标成最新版本。
# 推 ci/ 开头的分支只编不发，改了打包配置先用它试，编出来的包在这次运行的 Artifacts 里。
# 各平台共用的步骤在 .github/actions/build-app。
# 在线更新的安装包要签名：仓库 Settings → Secrets 里要有 TAURI_SIGNING_PRIVATE_KEY（没有密码）。
name: 安装包发布

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["ci/**"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Mac（Apple 芯片）, os: macos-latest, target: aarch64-apple-darwin, bundles: "app,dmg", arch: aarch64 }
          # Intel 版在 Intel 的 Mac 机器上原生编：和 Apple 芯片版放在同一种机器上时，两个任务抢同一批机器，
          # 机器紧张时 Intel 那个常常排不上（“not acquired by Runner”），整个发布就卡住。
          # GitHub 说 macos-15-intel 用到 2027 年 8 月，之后改回在 macos-latest 上交叉编
          - { name: Mac（Intel）, os: macos-15-intel, target: x86_64-apple-darwin, bundles: "app,dmg", arch: x64 }
          - { name: Windows（x64）, os: windows-latest, target: x86_64-pc-windows-msvc, bundles: nsis, arch: x64 }
          - { name: Windows（ARM64）, os: windows-latest, target: aarch64-pc-windows-msvc, bundles: nsis, arch: arm64 }
          - { name: Windows（32 位）, os: windows-latest, target: i686-pc-windows-msvc, bundles: nsis, arch: x86 }
          - { name: Linux（x64）, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: "appimage,deb,rpm", arch: x64 }
          - { name: Linux（ARM64）, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, bundles: "appimage,deb,rpm", arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-app
        with:
          target: ${{ matrix.target }}
          bundles: ${{ matrix.bundles }}
          arch: ${{ matrix.arch }}
          signing-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  release:
    name: 发布
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成更新清单并发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # 更新说明取标签附带的说明，没有就用默认的一句
          git fetch --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN/,$d')"
          [ -n "$notes" ] || notes="P2PCLI ${ver}"
          RELEASE_NOTES="$notes" node scripts/app-release.mjs
          cat dist/latest.json
          body="${notes}

          下载：
          - Mac（Apple 芯片，M1 到 M4 这些）：\`P2PCLI_${ver}_aarch64.dmg\`
          - Mac（Intel 芯片）：\`P2PCLI_${ver}_x64.dmg\`
          - Windows（大多数电脑）：\`P2PCLI_${ver}_x64-setup.exe\`
          - Windows（骁龙等 ARM 芯片）：\`P2PCLI_${ver}_arm64-setup.exe\`
          - Windows（32 位系统）：\`P2PCLI_${ver}_x86-setup.exe\`
          - Linux（Intel / AMD 64 位）：\`P2PCLI_${ver}_x64.AppImage\`、\`P2PCLI_${ver}_x64.deb\`、\`P2PCLI_${ver}_x64.rpm\`
          - Linux（ARM64）：\`P2PCLI_${ver}_arm64.AppImage\`、\`P2PCLI_${ver}_arm64.deb\`、\`P2PCLI_${ver}_arm64.rpm\`

          不知道 Mac 是哪种芯片：左上角苹果菜单 → 关于本机，芯片一栏写 Apple 的选第一个，写 Intel 的选第二个。
          不知道 Windows 选哪个：设置 → 系统 → 系统信息，系统类型写 基于 x64 的选 x64，写 基于 ARM 的选 arm64，写 32 位操作系统的选 x86。
          安装包没有付费签名，第一次打开会被系统拦一下：Mac 提示 Apple 无法验证时点 完成，再到 系统设置 → 隐私与安全性 点 仍要打开；Windows 点 更多信息 → 仍要运行。
          Linux 使用 Ubuntu 22.04 原生构建，桌面环境需支持 WebKitGTK 4.1；AppImage 先赋予执行权限，Ubuntu 缺 FUSE 时安装 libfuse2（24.04 为 libfuse2t64）。Debian / Ubuntu 选 DEB，Fedora 等 RPM 发行版选 RPM，包管理器负责安装依赖。内置 tmux，无需另装。SHA256SUMS 可核对下载完整性。
          装好以后软件会自动检查更新，有新版本在主界面点一下就能更新；Linux DEB / RPM 更新需要系统管理员授权。"
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --title "P2PCLI ${ver}" --notes "$body" --latest
