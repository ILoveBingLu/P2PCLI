# 推 vX.Y.Z 标签时，Mac 两种芯片、Windows 三种架构、Linux 两种架构的安装包，和手机的安卓 APK、iOS IPA 同时开编，
# 编完由“发布”汇总，连同在线更新用的 latest.json 一起发到发布页，并标成最新版本。
# 推 ci/ 开头的分支只编不发，改了打包配置先用它试，编出来的包在这次运行的 Artifacts 里。
# 各平台共用的步骤在 .github/actions/build-app。
# 在线更新的安装包要签名：仓库 Settings → Secrets 里要有 TAURI_SIGNING_PRIVATE_KEY（没有密码）。
# 安卓 APK 要用正式密钥签名，Secrets 里要有 ANDROID_KEYSTORE_BASE64（密钥文件转 base64）、ANDROID_KEYSTORE_PASSWORD、
# ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD。以后每个版本都要用同一份密钥，换了用户就没法覆盖升级。
# 没配密钥时这次发布不带安卓包（不会发调试密钥签的包）；手机包打失败也不拦桌面包发布。
# iOS 发不签名的 IPA，用户自己签名后安装（苹果不允许自签分发）。
name: 安装包发布

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["ci/**"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Mac（Apple 芯片）, os: macos-latest, target: aarch64-apple-darwin, bundles: "app,dmg", arch: aarch64 }
          # Intel 版在 Intel 的 Mac 机器上原生编：和 Apple 芯片版放在同一种机器上时，两个任务抢同一批机器，
          # 机器紧张时 Intel 那个常常排不上（“not acquired by Runner”），整个发布就卡住。
          # GitHub 说 macos-15-intel 用到 2027 年 8 月，之后改回在 macos-latest 上交叉编
          - { name: Mac（Intel）, os: macos-15-intel, target: x86_64-apple-darwin, bundles: "app,dmg", arch: x64 }
          - { name: Windows（x64）, os: windows-latest, target: x86_64-pc-windows-msvc, bundles: nsis, arch: x64 }
          - { name: Windows（ARM64）, os: windows-latest, target: aarch64-pc-windows-msvc, bundles: nsis, arch: arm64 }
          - { name: Windows（32 位）, os: windows-latest, target: i686-pc-windows-msvc, bundles: nsis, arch: x86 }
          - { name: Linux（x64）, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: "appimage,deb,rpm", arch: x64 }
          - { name: Linux（ARM64）, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, bundles: "appimage,deb,rpm", arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-app
        with:
          target: ${{ matrix.target }}
          bundles: ${{ matrix.bundles }}
          arch: ${{ matrix.arch }}
          signing-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  android:
    name: 安卓（ARM64）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 装 Android 编译目标
        run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: 取出签名密钥
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            # 正式发布不发调试密钥签的包：这次跳过安卓包。ci/ 分支试编时用调试密钥，只能自己试用
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::warning::仓库 Secrets 里没有 ANDROID_KEYSTORE_BASE64，这次发布不带安卓包"
              echo "SKIP_ANDROID=1" >> "$GITHUB_ENV"
            else
              echo "::warning::没有正式签名密钥，这次用调试密钥签名，只能自己试用"
            fi
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "P2PCLI_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "P2PCLI_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "P2PCLI_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "P2PCLI_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: 打包
        if: env.SKIP_ANDROID != '1'
        working-directory: mobile/android
        # 打包机上装了 NDK，路径在 ANDROID_NDK_LATEST_HOME
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./gradlew --no-daemon assembleRelease

      - name: 整理文件名
        if: env.SKIP_ANDROID != '1'
        run: |
          ver=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "out/P2PCLI_${ver}_android-arm64.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        if: env.SKIP_ANDROID != '1'
        with:
          name: android
          path: out/*
          if-no-files-found: error

  ios:
    name: iOS（不签名）
    # 要 Xcode 27.1 以上编，iPhone Duo 上才会铺满屏幕、跟着折叠调整
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: 选 Xcode
        run: |
          # 有正式版用正式版，只有测试版时用测试版（发的是不签名的包，给用户自己签名安装）
          xc=$(ls -d /Applications/Xcode_27*.app | grep -v -i beta | sort -V | tail -1)
          [ -n "$xc" ] || xc=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          sudo xcode-select -s "$xc"
          xcodebuild -version

      - name: 装 Rust、XcodeGen、Metal 工具链
        run: |
          # 打包机一般自带 Rust；没有才装
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup target add aarch64-apple-ios
          brew install xcodegen
          # 终端控件 SwiftTerm 带 Metal 着色器
          xcodebuild -downloadComponent MetalToolchain

      - uses: Swatinem/rust-cache@v2

      - name: 打包
        run: sh mobile/ios/build-ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: mobile/ios/build/*.ipa
          if-no-files-found: error

  release:
    name: 发布
    # 桌面包必须都打成功；手机包有哪个发哪个
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' && needs.build.result == 'success' }}
    needs: [build, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成更新清单并发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # 更新说明取标签附带的说明，没有就用默认的一句
          git fetch --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN/,$d')"
          [ -n "$notes" ] || notes="P2PCLI ${ver}"
          # 手机包：这次打出来了才写进下载说明
          mobile=""
          [ -f "dist/P2PCLI_${ver}_android-arm64.apk" ] && mobile="${mobile}
          - 安卓手机（含鸿蒙 4 及更早能装安卓应用的机型）：\`P2PCLI_${ver}_android-arm64.apk\`"
          [ -f "dist/P2PCLI_${ver}_ios-unsigned.ipa" ] && mobile="${mobile}
          - iPhone、iPad：\`P2PCLI_${ver}_ios-unsigned.ipa\`（不签名，需要用 AltStore、SideStore 或自己的开发者证书签名后安装）"
          RELEASE_NOTES="$notes" node scripts/app-release.mjs
          cat dist/latest.json
          body="${notes}

          下载：
          - Mac（Apple 芯片，M1 到 M4 这些）：\`P2PCLI_${ver}_aarch64.dmg\`
          - Mac（Intel 芯片）：\`P2PCLI_${ver}_x64.dmg\`
          - Windows（大多数电脑）：\`P2PCLI_${ver}_x64-setup.exe\`
          - Windows（骁龙等 ARM 芯片）：\`P2PCLI_${ver}_arm64-setup.exe\`
          - Windows（32 位系统）：\`P2PCLI_${ver}_x86-setup.exe\`
          - Linux（Intel / AMD 64 位）：\`P2PCLI_${ver}_x64.AppImage\`、\`P2PCLI_${ver}_x64.deb\`、\`P2PCLI_${ver}_x64.rpm\`
          - Linux（ARM64）：\`P2PCLI_${ver}_arm64.AppImage\`、\`P2PCLI_${ver}_arm64.deb\`、\`P2PCLI_${ver}_arm64.rpm\`${mobile}

          不知道 Mac 是哪种芯片：左上角苹果菜单 → 关于本机，芯片一栏写 Apple 的选第一个，写 Intel 的选第二个。
          不知道 Windows 选哪个：设置 → 系统 → 系统信息，系统类型写 基于 x64 的选 x64，写 基于 ARM 的选 arm64，写 32 位操作系统的选 x86。
          安装包没有付费签名，第一次打开会被系统拦一下：Mac 提示 Apple 无法验证时点 完成，再到 系统设置 → 隐私与安全性 点 仍要打开；Windows 点 更多信息 → 仍要运行。
          Linux 使用 Ubuntu 22.04 原生构建，桌面环境需支持 WebKitGTK 4.1；AppImage 先赋予执行权限，Ubuntu 缺 FUSE 时安装 libfuse2（24.04 为 libfuse2t64）。Debian / Ubuntu 选 DEB，Fedora 等 RPM 发行版选 RPM，包管理器负责安装依赖。内置 tmux，无需另装。SHA256SUMS 可核对下载完整性。
          手机端只当连接的一方，用来连电脑上的 P2PCLI；安卓包第一次安装时系统会提示来自未知来源，允许即可。
          装好以后软件会自动检查更新，有新版本在主界面点一下就能更新；Linux DEB / RPM 更新需要系统管理员授权。"
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --title "P2PCLI ${ver}" --notes "$body" --latest
