# 推 vX.Y.Z 标签时编译 Mac（通用版，Apple 芯片和 Intel 都能装）和 Windows 安装包，
# 连同在线更新用的 latest.json 一起发布，并标成最新版本。
# 在线更新的安装包要签名：仓库 Settings → Secrets 里要有 TAURI_SIGNING_PRIVATE_KEY（没有密码）。
name: 安装包发布

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 标签要和软件版本一致
        shell: bash
        run: |
          want="v$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "标签是 $GITHUB_REF_NAME，tauri.conf.json 里的版本对应 $want"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 装 Rust 目标
        shell: bash
        run: rustup target add ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: 打包
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "仓库 Secrets 里没有 TAURI_SIGNING_PRIVATE_KEY，在线更新包签不了名"
            exit 1
          fi
          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: 收集安装包
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          b="target/${{ matrix.target }}/release/bundle"
          mkdir dist
          if [ "${{ runner.os }}" = macOS ]; then
            cp "$b/dmg/P2PCLI_${ver}_universal.dmg" dist/
            cp "$b/macos/P2PCLI.app.tar.gz" "dist/P2PCLI_${ver}_universal.app.tar.gz"
            cp "$b/macos/P2PCLI.app.tar.gz.sig" "dist/P2PCLI_${ver}_universal.app.tar.gz.sig"
          else
            cp "$b/nsis/P2PCLI_${ver}_x64-setup.exe" dist/
            cp "$b/nsis/P2PCLI_${ver}_x64-setup.exe.sig" dist/
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          # 更新说明取标签附带的说明，没有就用默认的一句
          git fetch --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN/,$d')"
          [ -n "$notes" ] || notes="P2PCLI ${ver}"
          mac="P2PCLI_${ver}_universal.app.tar.gz"
          win="P2PCLI_${ver}_x64-setup.exe"
          jq -n --arg v "$ver" --arg notes "$notes" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_url "$base/$mac" --arg mac_sig "$(cat "dist/$mac.sig")" \
            --arg win_url "$base/$win" --arg win_sig "$(cat "dist/$win.sig")" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
              "darwin-aarch64": {url: $mac_url, signature: $mac_sig},
              "darwin-x86_64": {url: $mac_url, signature: $mac_sig},
              "windows-x86_64": {url: $win_url, signature: $win_sig}
            }}' > dist/latest.json
          cat dist/latest.json
          body="${notes}

          下载：Mac 用 \`P2PCLI_${ver}_universal.dmg\`（Apple 芯片和 Intel 都能装），Windows 用 \`P2PCLI_${ver}_x64-setup.exe\`。
          安装包没有付费签名，第一次打开会被系统拦一下：Mac 到 系统设置 → 隐私与安全性 点 仍要打开；Windows 点 更多信息 → 仍要运行。
          装好以后软件会自动检查更新，有新版本在主界面点一下就能更新。"
          gh release create "$GITHUB_REF_NAME" \
            "dist/P2PCLI_${ver}_universal.dmg" "dist/$mac" "dist/$win" dist/latest.json \
            --title "P2PCLI ${ver}" --notes "$body" --latest
