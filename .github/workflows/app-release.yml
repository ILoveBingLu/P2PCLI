# 推 vX.Y.Z 标签时，Mac（Apple 芯片）、Mac（Intel）、Windows 三个安装包同时开编，
# 编完由“发布”汇总，连同在线更新用的 latest.json 一起发到发布页，并标成最新版本。
# 各平台共用的步骤在 .github/actions/build-app。
# 在线更新的安装包要签名：仓库 Settings → Secrets 里要有 TAURI_SIGNING_PRIVATE_KEY（没有密码）。
name: 安装包发布

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac-arm:
    name: Mac（Apple 芯片）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-app
        with:
          target: aarch64-apple-darwin
          bundles: app,dmg
          arch: aarch64
          signing-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  mac-intel:
    name: Mac（Intel）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-app
        with:
          target: x86_64-apple-darwin
          bundles: app,dmg
          arch: x64
          signing-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-app
        with:
          target: x86_64-pc-windows-msvc
          bundles: nsis
          arch: x64
          signing-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  release:
    name: 发布
    needs: [mac-arm, mac-intel, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成更新清单并发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          # 更新说明取标签附带的说明，没有就用默认的一句
          git fetch --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN/,$d')"
          [ -n "$notes" ] || notes="P2PCLI ${ver}"
          arm="P2PCLI_${ver}_aarch64.app.tar.gz"
          intel="P2PCLI_${ver}_x64.app.tar.gz"
          win="P2PCLI_${ver}_x64-setup.exe"
          jq -n --arg v "$ver" --arg notes "$notes" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg arm_url "$base/$arm" --arg arm_sig "$(cat "dist/$arm.sig")" \
            --arg intel_url "$base/$intel" --arg intel_sig "$(cat "dist/$intel.sig")" \
            --arg win_url "$base/$win" --arg win_sig "$(cat "dist/$win.sig")" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
              "darwin-aarch64": {url: $arm_url, signature: $arm_sig},
              "darwin-x86_64": {url: $intel_url, signature: $intel_sig},
              "windows-x86_64": {url: $win_url, signature: $win_sig}
            }}' > dist/latest.json
          cat dist/latest.json
          body="${notes}

          下载：
          - Mac（Apple 芯片，M1 到 M4 这些）：\`P2PCLI_${ver}_aarch64.dmg\`
          - Mac（Intel 芯片）：\`P2PCLI_${ver}_x64.dmg\`
          - Windows：\`P2PCLI_${ver}_x64-setup.exe\`

          不知道 Mac 是哪种芯片：左上角苹果菜单 → 关于本机，芯片一栏写 Apple 的选第一个，写 Intel 的选第二个。
          安装包没有付费签名，第一次打开会被系统拦一下：Mac 到 系统设置 → 隐私与安全性 点 仍要打开；Windows 点 更多信息 → 仍要运行。
          装好以后软件会自动检查更新，有新版本在主界面点一下就能更新。"
          gh release create "$GITHUB_REF_NAME" \
            "dist/P2PCLI_${ver}_aarch64.dmg" "dist/P2PCLI_${ver}_x64.dmg" \
            "dist/$arm" "dist/$intel" "dist/$win" dist/latest.json \
            --title "P2PCLI ${ver}" --notes "$body" --latest
